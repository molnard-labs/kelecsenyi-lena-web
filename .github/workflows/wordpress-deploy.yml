name: WordPress deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wordpress/themes/**"
      - "wordpress/plugins/**"
      - ".github/workflows/wordpress-deploy.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find wordpress/themes wordpress/plugins -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.WP_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.WP_DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy child theme
        run: |
          rsync -az --delete wordpress/themes/zodiac-astrology-child/ \
            "${{ secrets.WP_DEPLOY_USER }}@${{ secrets.WP_DEPLOY_HOST }}:${{ secrets.WP_DEPLOY_PATH }}/themes/zodiac-astrology-child/"
      - name: Deploy plugin
        run: |
          rsync -az --delete wordpress/plugins/lena-core/ \
            "${{ secrets.WP_DEPLOY_USER }}@${{ secrets.WP_DEPLOY_HOST }}:${{ secrets.WP_DEPLOY_PATH }}/plugins/lena-core/"

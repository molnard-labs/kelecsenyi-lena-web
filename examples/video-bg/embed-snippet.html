<!--
  Kelecsényi Léna — háttérvideó beágyazás (WordPress / HTML)
  A szöveget te teszed elé WordPressben; ez csak a teljes szélességű,
  loopoló háttérvideó. Töltsd fel a 3 fájlt a Médiatárba, és írd át
  az URL-eket a sajátodra.

  Fontos attribútumok a folyamatos loophoz:
   - muted + autoplay + loop + playsinline  -> mobilon is elindul, némán
   - poster -> az első kocka, amíg a videó betölt (nincs villanás)
   - a forrás sorrend: WebM elöl (kisebb), MP4 fallback
-->

<div class="hero-bg">
  <video
    class="hero-bg__video"
    autoplay muted loop playsinline preload="auto"
    poster="kelecsenyi-lena-bg-poster.jpg">
    <source src="kelecsenyi-lena-bg-web-1080p.webm" type="video/webm">
    <source src="kelecsenyi-lena-bg-web-1080p.mp4"  type="video/mp4">
  </video>

  <!-- A szöveged ide jön (vagy WordPressben a videó fölé rétegezve) -->
  <div class="hero-bg__content">
    <!-- pl. <h1>Kelecsényi Léna</h1> -->
  </div>
</div>

<style>
  .hero-bg {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;   /* vagy: height: 100vh; teljes képernyős hero-hoz */
    overflow: hidden;
    background: #0a0710;     /* a videó sötét hátteréhez illő szín */
  }
  .hero-bg__video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;       /* mindig kitölti a keretet, nincs fekete sáv */
    pointer-events: none;
  }
  .hero-bg__content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: #f2e3bd;
  }
</style>
